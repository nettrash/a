[package]
name = "nettrash-a"
version = "0.2.46"
edition = "2024"
description = "Pure-Rust algorithms, no dependencies: 23 sorts; big integers: fast products and division, roots, GCDs, primes, factorisation, modular arithmetic; fixed-width integers with Montgomery pow_mod; rationals; correctly rounded real and complex floats of any precision; quaternions; dual numbers (automatic differentiation); polynomials with fast products, GCDs, certified roots, factorisation; FFTs of any length; prime, extension, binary, AES and GCM finite fields; elliptic curves (secp256k1, P-256, P-384, P-521, Curve25519, Ed25519, SEC 2's binary curves); BN254 and BLS12-381 pairings; hashing to curves (RFC 9380); SHA-2; matrices: LAPACK's decompositions, exact determinants and solutions, Hermite and Smith forms, GF(p) and GF(2); lattices: LLL, L², BKZ, shortest and closest vectors, PSLQ; sparse matrices: direct and Krylov solvers, eigenvalues; numerics: roots, quadrature, ODEs, optimisation, linear programming, interpolation; special functions with stated ulp bounds. Not constant-time."
license = "MIT"
repository = "https://github.com/nettrash/a"
readme = "../README.md"
keywords = ["algorithms", "sorting", "bignum", "elliptic-curve", "matrix"]
categories = ["algorithms", "mathematics", "science"]
rust-version = "1.88"
# The tests' reference data stay in the repository: with them the published package would come
# close to crates.io's size limit, and building or using the crate does not need them.
exclude = ["tests/**/data/"]

[lib]
name = "a"

[dependencies]

# `--cfg a_baseline` (in RUSTFLAGS) makes every run-time CPU feature check report "absent", so a
# test run exercises the portable fallbacks of the SIMD and instruction-set paths.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(a_baseline)"] }

# Full debug info for the tests, with their many instantiations of the sorts, took the build
# past the memory of the CI runner; line tables still locate panics and backtraces.
[profile.test]
debug = "line-tables-only"
