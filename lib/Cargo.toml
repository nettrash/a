[package]
name = "nettrash-a"
version = "0.2.41"
edition = "2024"
description = "Algorithms in pure Rust with no dependencies: 23 sorting algorithms and a default sort; arbitrary-precision integers with Karatsuba, Toom-Cook and NTT multiplication, Newton division, GCD, roots, modular powers, primes and modular square roots; elliptic curves over prime fields with secp256k1, P-256, P-384, P-521, Curve25519 and Ed25519; complex numbers; rational numbers in lowest terms with continued fractions, best approximations, rational reconstruction and Bernoulli and harmonic numbers; correctly rounded real and complex floats of any precision; polynomials over integers, rationals and floats or modulo n with fast products, GCDs, resultants, multipoint evaluation, certified roots and factorisation; fast Fourier transforms of any length, real, complex, 2D and 3D, cosine and sine transforms I–IV and convolutions; matrices of floats, complex numbers, integers or rationals with LU, QR, Cholesky, SVD, Schur and eigendecompositions, exp, sqrt and log, and exact determinants, solutions and inverses of integer and rational matrices; numerical methods on `f32` and `f64` — roots of one equation and of a system, adaptive Gauss-Kronrod, Clenshaw-Curtis and tanh-sinh quadrature, stiff and non-stiff ODE solvers, minima and least-squares fits, splines, Chebyshev approximation and numerical differentiation; special functions of `f32`, `f64` and complex arguments with stated ulp bounds — the gamma family, the error functions, Bessel and Airy functions of real order, the zeta function and polylogarithms, Lambert W and the exponential integrals, elliptic integrals, Jacobi elliptic functions and orthogonal polynomials. Not constant-time."
license = "MIT"
repository = "https://github.com/nettrash/a"
readme = "../README.md"
keywords = ["algorithms", "sorting", "bignum", "elliptic-curve", "matrix"]
categories = ["algorithms", "mathematics", "science"]
rust-version = "1.88"

[lib]
name = "a"

[dependencies]

# Full debug info for the tests, with their many instantiations of the sorts, took the build
# past the memory of the CI runner; line tables still locate panics and backtraces.
[profile.test]
debug = "line-tables-only"
