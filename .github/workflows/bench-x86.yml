name: Benchmarks (x86_64)

# The speed-pass scoreboards (bench/) on an x86_64 Linux runner, by hand only. The published
# figures come from an Apple M4 Max; this run gives the same rows on x86_64 for information. A
# GitHub runner is a shared virtual machine, so its timings are noisier than the Mac's.
#
# The areas are split into shards of a few hours each (GitHub stops a job after 6 hours). The
# estimate: each area's run on the M4 Max during the speed pass (its per-group logs and the birth
# and modification times of its part files; those runs waited for shared timing slots on a loaded
# machine, so they are upper bounds), doubled for a 4-vCPU runner, plus up to 30 minutes of
# installs and builds:
#   nt ~1.2 h, numbers ~5 min, numerics ~1.5 h, lp ~20 min, float ~3.5 h, curves ~1 h,
#   special ~25 min, rational ~3 h, fft ~2.2 h, numtypes ~3.4 h, poly-1 ~1.7 h, poly-2 ~1.9 h,
#   fields-1 ~2.3 h, fields-2 ~3 h, lattice-1..3 ~1.5-2.5 h each, sparse-1..3 ~1.5-2.5 h each.
# Each shard's Run step stops at 5 hours (the rows of its finished groups stay in the uploaded
# working files).

on:
  workflow_dispatch:
    inputs:
      areas:
        description: >-
          Areas to run, separated by spaces: nt numbers numerics lp float curves special rational
          fft poly numtypes fields lattice sparse, or all
        type: string
        default: all

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  # One runner per shard and one timing process at a time on it: no slot wrapper needed.
  BENCH_SLOT: ""

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        name: Choose the shards
        env:
          AREAS: ${{ inputs.areas }}
        run: |
          shards='[
            {"name": "nt", "area": "nt", "args": ""},
            {"name": "numbers", "area": "numbers", "args": ""},
            {"name": "numerics", "area": "numerics", "args": ""},
            {"name": "lp", "area": "lp", "args": ""},
            {"name": "float", "area": "float", "args": ""},
            {"name": "curves", "area": "curves", "args": ""},
            {"name": "special", "area": "special", "args": ""},
            {"name": "rational", "area": "rational", "args": ""},
            {"name": "fft", "area": "fft", "args": ""},
            {"name": "poly-1", "area": "poly", "args": "wmul wdiv mlimb zarith"},
            {"name": "poly-2", "area": "poly", "args": "qarith farith gcd eval roots factor"},
            {"name": "numtypes", "area": "numtypes", "args": ""},
            {"name": "fields-1", "area": "fields", "args": "prime"},
            {"name": "fields-2", "area": "fields", "args": "ext tower binary gf2"},
            {"name": "lattice-1", "area": "lattice", "args": "lll:knapsack lll:NTRU lll:q-ary lll:uniform lll:Goldstein lll-exact deep isred"},
            {"name": "lattice-2", "area": "lattice", "args": "bkz:knapsack bkz:q-ary bkz:NTRU bkz:Goldstein bkz:uniform enum pslq normal exact"},
            {"name": "lattice-3", "area": "lattice", "args": "modp:* modp:ple modp:rank modp:det modp:solve modp:inverse modp:rref modp:null_space modp:from_matrix,+,-,scale,transpose gf2:n=256,n=1024 gf2:n=4096 gf2:n=8192 gf2:n=16384 gf2:add_row,swap_rows"},
            {"name": "sparse-1", "area": "sparse", "args": "ops io ordering chol"},
            {"name": "sparse-2", "area": "sparse", "args": "lu qr iter eigen"},
            {"name": "sparse-3", "area": "sparse", "args": "py-storage py-io py-ordering py-lu py-iter py-eigen"}
          ]'
          areas=$(echo "${AREAS:-all}" | tr ',' ' ')
          if [ "$areas" = all ] || [ -z "${areas// /}" ]; then
            sel=$shards
          else
            want=$(printf '%s\n' $areas | jq -R . | jq -cs .)
            unknown=$(jq -r --argjson w "$want" '[.[].area] as $k | $w - $k | join(" ")' <<< "$shards")
            if [ -n "$unknown" ]; then
              echo "::error::unknown areas: $unknown"
              exit 1
            fi
            sel=$(jq -c --argjson w "$want" '[.[] | select(.area as $a | $w | index($a))]' <<< "$shards")
          fi
          echo "shards=$(jq -c . <<< "$sel")" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "\(.name): \(.area) \(.args)"' <<< "$sel"

  bench:
    name: bench (${{ matrix.name }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 358
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the C and C++ references
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config git \
            libgmp-dev libmpfr-dev libmpc-dev libflint-dev libntl-dev libpari-dev pari-gp \
            libfftw3-dev libgsl-dev libboost-dev libprimesieve-dev libprimecount-dev libecm-dev \
            libm4ri-dev libfplll-dev libssl-dev libsuitesparse-dev libopenblas-dev liblapack-dev
          # Optional: msieve (nt) and METIS are not packaged everywhere.
          for p in msieve libmetis-dev; do
            sudo apt-get install -y --no-install-recommends "$p" || echo "::notice::$p is not available here"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the Python references
        run: python3 -m pip install numpy==2.3.3 scipy==1.18.0 mpmath==1.3.0 sympy==1.14.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build mcl (herumi/mcl at a pinned commit)
        if: matrix.area == 'curves' || matrix.area == 'fields'
        run: echo "MCL_DIR=$(bench/mcl.sh)" >> "$GITHUB_ENV"

      - name: Build
        run: bench/run_all.sh --build-only ${{ matrix.area }}

      - name: Describe the machine
        run: |
          mkdir -p bench/results
          {
            echo "shard: ${{ matrix.name }} (${{ matrix.area }} ${{ matrix.args }})"
            echo "commit: $GITHUB_SHA"
            uname -a
            lscpu
            free -h
            rustc -Vv
            cc --version | head -n 1
            python3 -c 'import numpy, scipy, mpmath; print("numpy", numpy.__version__, "scipy", scipy.__version__, "mpmath", mpmath.__version__)'
            dpkg-query -W -f='${Package} ${Version}\n' libgmp-dev libmpfr-dev libmpc-dev libflint-dev \
              libntl-dev libpari-dev libfftw3-dev libgsl-dev libboost-dev libprimesieve-dev \
              libprimecount-dev libecm-dev libm4ri-dev libfplll-dev libssl-dev libsuitesparse-dev \
              libopenblas-dev 2>/dev/null || true
          } | tee "bench/results/machine-${{ matrix.name }}.txt"

      - name: Run
        timeout-minutes: 300
        continue-on-error: true
        env:
          SHARD_ARGS: ${{ matrix.args }}
        run: bench/run_all.sh --args "$SHARD_ARGS" ${{ matrix.area }}

      - name: Upload the scoreboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.name }}
          path: |
            bench/results/
            bench/work/**/*.tsv
            bench/work/**/*.log
            bench/work/**/*.err
            bench/work/**/*.txt
          if-no-files-found: warn

  collect:
    name: collect
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          path: shards

      - name: Merge the shards
        run: |
          mkdir -p bench/results
          # Shards of one area are joined in the order of the plan (their artifact names sort so).
          for d in $(ls -d shards/bench-* | sort -V); do
            for f in "$d"/results/*.tsv; do
              [ -f "$f" ] || continue
              out=bench/results/$(basename "$f")
              if [ -f "$out" ]; then tail -n +2 "$f" >> "$out"; else cp "$f" "$out"; fi
            done
            cp "$d"/results/machine-*.txt bench/results/ 2>/dev/null || true
          done
          python3 bench/summarize.py > bench/results/SUMMARY.md
          cat bench/results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results/
