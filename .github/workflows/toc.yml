name: Update TOC

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  toc:
    name: Generate README Table of Contents
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate TOC
        uses: technote-space/toc-generator@v4
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOC_TITLE: Table of contents
          TARGET_PATHS: |
            README.md
